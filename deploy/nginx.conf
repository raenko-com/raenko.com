# nginx для raenko.pro: статика сайта + проксирование формы заявок в raenko-bot.
# Скопировать в /etc/nginx/sites-available/raenko.pro, включить ссылкой в sites-enabled.
# Сертификат выпускается certbot (см. DEPLOY.md), пути ниже он подставит сам или их нужно поправить.

# не больше 10 запросов в минуту с одного IP на форму заявок
limit_req_zone $binary_remote_addr zone=lead:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name raenko.pro www.raenko.pro;
    # certbot кладёт сюда файлы проверки домена
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://raenko.pro$request_uri; }
}

server {
    # http2 так пишется и в nginx 1.24 (Ubuntu 24.04); в 1.25+ будет лишь предупреждение
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.raenko.pro;
    ssl_certificate     /etc/letsencrypt/live/raenko.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/raenko.pro/privkey.pem;
    return 301 https://raenko.pro$request_uri;
}

server {
    # http2 так пишется и в nginx 1.24 (Ubuntu 24.04); в 1.25+ будет лишь предупреждение
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name raenko.pro;

    ssl_certificate     /etc/letsencrypt/live/raenko.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/raenko.pro/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    root /var/www/raenko.pro;
    index index.html;
    charset utf-8;
    server_tokens off;          # не показывать версию nginx
    client_max_body_size 32k;   # форме больше не нужно

    # --- заголовки безопасности (always = и для ответов с ошибкой) ---
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    # Скрипты, стили и шрифты только свои. 'unsafe-inline' для стилей нужен из-за style="" в разметке.
    # Если форма шлёт заявки на другой домен (LEAD_API = https://...), добавьте его в connect-src.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;

    # --- служебные файлы не отдаём, даже если случайно попали на сервер ---
    location ~ /\.            { deny all; return 404; }
    location ~ ^/(tools|deploy|palettes|calculator)/ { return 404; }
    location ~* \.(md|py|sh|gs|conf|ya?ml|json|lock|log|bak|orig|swp)$ { return 404; }

    # --- форма заявок -> raenko-bot на этом же сервере ---
    location = /api/lead {
        limit_req zone=lead burst=5 nodelay;
        limit_req_status 429;
        limit_except POST OPTIONS { deny all; }
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;   # бот читает его при TRUST_PROXY=1
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 15s;
    }

    # --- статика ---
    # css/js/шрифты/картинки подключаются с ?v=N, поэтому их можно кэшировать надолго
    location ~* \.(css|js|woff2|svg|png|jpe?g|webp|ico)$ {
        expires 30d;
        add_header Cache-Control "public" always;
        # add_header внутри location сбрасывает внешние, поэтому повторяем важные
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        try_files $uri =404;
    }
    location ~* \.pdf$ {
        add_header Content-Disposition "attachment" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }
    location / {
        try_files $uri $uri/ =404;
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
    gzip_min_length 1024;
}
